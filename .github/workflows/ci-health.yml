# CI health watchdog (LIN-135) — main's CI must be green, always.
#
# Runs daily and fails loudly when the newest completed run on main is red,
# so an unhealthy main shows up on the repo's Actions page as a failing
# "ci-health" badge instead of waiting for someone to scroll the run list.
name: ci-health

on:
  schedule:
    - cron: '23 7 * * *' # daily, off the :00 mark
  workflow_dispatch: {}

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the latest run on main is not green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Newest completed run on main, ignoring this watchdog's own runs.
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "completed" and .path != ".github/workflows/ci-health.yml")][0]')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "::error::No completed runs found on main — CI has never run."
            exit 1
          fi
          CONCLUSION=$(echo "$LATEST" | jq -r '.conclusion')
          TITLE=$(echo "$LATEST" | jq -r '.display_title')
          URL=$(echo "$LATEST" | jq -r '.html_url')
          echo "Latest completed run on main: $TITLE — $CONCLUSION ($URL)"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI on main is not green: $CONCLUSION — $TITLE ($URL). Fix before shipping anything else."
            exit 1
          fi
